<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Run Predictions</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px auto; max-width: 700px; padding: 0 20px; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .message { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
        input, select { width: 100%; padding: 8px; margin: 8px 0 12px; box-sizing: border-box; }
        button { padding: 10px 18px; font-size: 16px; }
    </style>
</head>
<body>
    <h2>🧠 Run Complaint Predictions</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, msg in messages %}
                <p class="{% if category == 'error' %}error{% else %}message{% endif %}">{{ msg }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <div class="card">
        <form method="post">
            <label for="test_file_path">Test CSV File Path</label>
            <input type="text" id="test_file_path" name="test_file_path" placeholder="e.g. data/test.csv" required>

            <label for="validation_file_path">Validation CSV File Path</label>
            <input type="text" id="validation_file_path" name="validation_file_path" placeholder="e.g. data/val.csv" required>

            <label for="mode">Prediction Mode</label>
            <select id="mode" name="mode">
                <option value="predict">Predict</option>
                <option value="predict_rag">Predict with RAG</option>
            </select>

            <button type="submit">Run Prediction</button>
        </form>
    </div>

    <p><a href="/">← Back to Home</a></p>
</body>
</html>
