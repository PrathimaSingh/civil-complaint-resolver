<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RAG Complaint Processing</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px auto; max-width: 700px; padding: 0 20px; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .message { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; margin: 8px 0 12px; box-sizing: border-box; }
        button { padding: 10px 18px; font-size: 16px; }
    </style>
</head>
<body>
    <h2>🧠 Run RAG Complaint Processing</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, msg in messages %}
                <p class="{% if category == 'error' %}error{% else %}message{% endif %}">{{ msg }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <div class="card">
        <form method="post">
            <label for="rag_input">Input</label>
            <textarea id="rag_input" name="rag_input" rows="4" placeholder="<title>|<description>" required></textarea>
            <button type="submit">Start RAG Processing</button>
        </form>
    </div>

    <p><a href="/">← Back to Home</a></p>
</body>
</html>
