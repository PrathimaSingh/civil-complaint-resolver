[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "civic-redressal"
version = "0.1.0"
description = "An agentic AI-powered civic complaint resolution system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask==2.3.3",
    "langchain-core>=1.0.0,<2.0.0",
    "langchain-ollama>=0.3.0",
    "langchain-chroma>=0.2.0",
    "langgraph>=1.0.0",
    "chromadb>=0.5.0",
    "Pillow>=10.0.1",
    "ImageHash>=4.3.1",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
    "mypy",
    "pip-tools",
]

[tool.hatch.build.targets.wheel]
packages = ["src/civic_redressal"]

[project.scripts]
civifix-cli = "civic_redressal.cli.app:main"